<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WMM Audio Server - Acceso Orador</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/env-config.js"></script>
    <script src="/js/common/logger.js"></script>
</head>

<body>
    <div class="container">
        <div class="card" style="max-width: 480px;">
            <div class="card-header">
                <h1>Acceso Orador</h1>
                <p>Ingresa tus credenciales para comenzar a transmitir</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="speakerName">👤 Tu nombre</label>
                    <input type="text" id="speakerName" class="form-control" placeholder="Ej: Pablo Cardozo" required
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="secretKey">🔑 Clave de acceso</label>
                    <input type="password" id="secretKey" class="form-control" placeholder="Ingresa la clave WMM"
                        required>
                </div>

                <div class="error-message" id="errorMessage">
                    ❌ Clave incorrecta o error de conexión
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Iniciar Transmisión
                </button>
            </form>

            <a href="/" class="back-link">← Volver al inicio</a>
        </div>
    </div>

    <script src="/js/login.js"></script>
    <script src="/js/pwa-init.js"></script>
</body>

</html>
